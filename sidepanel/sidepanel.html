<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>网申自动填写助手</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="../icons/icon32.png" alt="" />
      <span class="brand-name">网申自动填写助手</span>
      <span class="spacer"></span>
      <button id="btnOptions" class="pill-btn" title="AI 服务商、简历 PDF 导入、档案备份等设置">⚙ 设置</button>
    </div>

    <div class="prof-row">
      <span class="prof-label">档案</span>
      <select id="profileSel" title="切换当前档案（例如：通用版 / 固件版简历）"></select>
      <button id="btnNewProfile" class="icon-btn" title="新建档案（默认含全部 51 个字段）">＋</button>
      <div class="menu-wrap">
        <button id="btnMore" class="icon-btn" title="档案操作：重命名 / 删除 / 敏感信息显示">⋯</button>
        <div id="moreMenu" class="menu" hidden>
          <button data-act="rename">✎ 重命名档案</button>
          <button data-act="delete" class="danger">🗑 删除档案</button>
          <div class="menu-sep"></div>
          <button data-act="reveal" title="敏感字段默认显示 ••••，此项可临时全部可见">👁 显示全部敏感字段</button>
        </div>
      </div>
    </div>

    <nav class="tabs">
      <button data-tab="fields" class="active">字段库</button>
      <button data-tab="fill" id="tabFillBtn">一键填充<span id="tabFillBadge" class="tab-badge" hidden></span></button>
      <button data-tab="smart" id="tabSmartBtn">智能填表</button>
      <button data-tab="ledger">台账</button>
      <button data-tab="materials">附件</button>
    </nav>
  </header>

  <main>
    <section id="tab-fields"></section>
    <section id="tab-fill" hidden></section>
    <section id="tab-smart" hidden>
      <div class="card">
        <h3>当前招聘页面</h3>
        <label><input type="checkbox" id="smartPageConsent" /> 我授权扫描当前招聘页的表单标签及结构</label>
        <p class="muted">扫描不读取密码、验证码或已有输入值。网页已填内容仅在点击“读取此字段”时读取。</p>
        <div class="smart-actions"><button id="smartScan" class="btn">授权并扫描当前页</button><button id="smartRefresh" class="btn ghost">刷新结果</button><button id="smartRevoke" class="btn ghost">撤销页面授权</button></div>
        <button id="smartStopFill" class="btn ghost" type="button" hidden>停止填写</button><p id="smartStatus" role="status"></p>
        <div class="smart-actions"><button id="smartAI" class="btn ghost">检测到未知字段，是否使用 AI 识别？</button><button id="smartFillAll" class="btn">一键填写预览</button><button id="smartRules" class="btn ghost">历史映射规则</button></div>
      </div>
      <div id="smartAIReview" class="card" hidden><h3>确认模型接收方与发送内容</h3><p id="smartRecipient"></p><p id="smartAICoverage" role="status"></p><p>仅发送以下脱敏元数据及本地来源引用，不发送实际值、完整简历或网页 HTML。</p><pre id="smartAIPayload"></pre><label><input type="checkbox" id="smartAIConsent" /> 我确认向该服务商发送上述内容（可能计费）</label><button id="smartAISend" class="btn">确认发送并识别</button><button id="smartAICancel" class="btn ghost">取消</button></div>
      <div id="smartFillReview" class="card" hidden><h3>核对即将填入网页的资料</h3><pre id="smartFillPayload"></pre><label><input id="smartFillConsent" type="checkbox" /> 我已核对字段、来源和实际值，确认填写（不会提交申请）</label><label><input id="smartRememberAfter" type="checkbox" /> 填写验证成功后记住本次映射</label><div class="smart-actions"><button id="smartFillConfirm" class="btn">确认填写</button><button id="smartFillCancel" class="btn ghost">取消</button></div></div>
      <h3>已匹配 / 待确认及缺少资料</h3><div id="smartMatched"></div>
      <h3>未知字段</h3><div id="smartUnknown"></div>
      <section id="smartRulesPanel" class="card" hidden><h3>本地字段映射</h3><p class="muted">修改目标后必须重新填写验证。撤销仅针对本会话最近一次规则操作。</p><div class="smart-actions"><button id="smartUndo" class="btn ghost">撤销上次规则操作</button><button id="smartExportV3" class="btn ghost">导出兼容旧版 v3 的备份</button></div><div id="smartRuleList"></div></section>
    </section>
    <section id="tab-ledger" hidden></section>
    <section id="tab-materials" hidden></section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="../data/templates.js"></script>
  <script src="../common.js"></script>
  <script src="sidepanel.js"></script>
  <script src="field-learning.js"></script>
</body>
</html>
